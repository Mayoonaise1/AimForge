<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AimForge</title>
<style>
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap;
  src: url(data:font/woff2;base64,/*FONT*/) format('woff2'); }
:root {
  --bg: #0b0e13; --bg2: #0e1219; --surface: #131922; --surface2: #18202b; --surface3: #1f2835;
  --line: #222b39; --line2: #2d394b; --text: #e8edf4; --text2: #b3bdcb; --muted: #7d899b;
  --accent: #3ee3ae; --accent2: #1fb587; --accent-ink: #04241a; --accent-soft: rgba(62, 227, 174, .11);
  --warn: #ffb547; --warn-soft: rgba(255, 181, 71, .1); --bad: #ff5a6e; --bad-soft: rgba(255, 90, 110, .1); --info: #6ea8ff;
  --r-lg: 16px; --r: 12px; --r-sm: 8px; --tb: 0px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  /* alte Namen, die im Code noch verwendet werden */
  --panel: var(--surface); --panel2: var(--surface2);
}
html.desktop { --tb: 38px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 14.5px/1.5 Inter, system-ui, "Segoe UI", sans-serif; font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent-soft); }
.hidden { display: none !important; }
.ico { flex-shrink: 0; vertical-align: middle; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- Bedienelemente ---------- */
button { font: inherit; font-weight: 550; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  border: 1px solid var(--line2); background: var(--surface3); color: var(--text); padding: 9px 16px; border-radius: var(--r-sm);
  transition: background .15s, border-color .15s, transform .08s, box-shadow .15s; }
button:hover { background: #263142; border-color: #3a485d; }
button:active { transform: translateY(1px); }
button.primary { background: linear-gradient(180deg, #52ebbb, var(--accent2)); color: var(--accent-ink); border-color: transparent;
  box-shadow: 0 6px 18px rgba(31, 181, 135, .25); }
button.primary:hover { background: linear-gradient(180deg, #6ff2c9, #2cc596); }
button.danger { background: var(--bad); color: #2a0509; border-color: transparent; }
button.ghost { background: transparent; border-color: transparent; color: var(--text2); }
button.ghost:hover { background: var(--surface2); }
button.lg { padding: 13px 22px; font-size: 15.5px; border-radius: 10px; }
input, select { font: inherit; background: var(--bg2); color: var(--text); border: 1px solid var(--line2); border-radius: var(--r-sm);
  padding: 9px 11px; width: 100%; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=checkbox] { accent-color: var(--accent2); width: 16px; height: 16px; margin: 0 8px 0 0; vertical-align: -3px; }
input[type=color] { padding: 3px; height: 40px; cursor: pointer; }
label { display: block; color: var(--muted); font-size: 12.5px; font-weight: 550; margin-bottom: 6px; }
h1, h2, h3 { margin: 0 0 12px; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 26px; letter-spacing: -.02em; } h3 { font-size: 16px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); } small { color: var(--muted); }
code { font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; }

/* ---------- Fensterleiste (nur Windows-App) ---------- */
#titlebar { position: fixed; top: 0; left: 0; right: 0; height: var(--tb); display: none; align-items: center; gap: 10px;
  padding: 0 14px; background: var(--bg); border-bottom: 1px solid var(--line); -webkit-app-region: drag; z-index: 40;
  font-size: 12.5px; color: var(--muted); user-select: none; }
html.desktop #titlebar { display: flex; }
#titlebar b { color: var(--text2); font-weight: 650; }
html.playing #titlebar { display: none; }

/* ---------- Grundaufbau ---------- */
canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
#menu { position: fixed; top: var(--tb); left: 0; right: 0; bottom: 0; display: flex; background: var(--bg); }
nav { width: 236px; background: var(--bg2); border-right: 1px solid var(--line); padding: 18px 12px 14px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
nav .logo { display: flex; align-items: center; gap: 10px; margin: 2px 8px 22px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
nav .logo .t span { color: var(--accent); }
nav .section { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: #566273; margin: 14px 12px 6px; }
nav button { justify-content: flex-start; gap: 12px; border: none; background: none; padding: 9px 12px; color: var(--text2); font-weight: 550; border-radius: 9px; position: relative; }
nav button .ico { color: var(--muted); transition: color .15s; }
nav button:hover { background: var(--surface); color: var(--text); }
nav button.active { background: var(--accent-soft); color: var(--text); }
nav button.active .ico { color: var(--accent); }
nav button.active::before { content: ''; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
nav .sensbox { margin-top: auto; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); font-size: 13px; cursor: pointer; transition: border-color .15s; }
nav .sensbox:hover { border-color: var(--line2); }
nav .sensbox .v { font-size: 20px; font-weight: 750; letter-spacing: -.02em; }
main { flex: 1; overflow-y: auto; padding: 36px 44px 60px; }
.page { max-width: 1080px; margin: 0 auto; animation: pagein .18s ease-out; }
@keyframes pagein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page > h2 { margin-bottom: 6px; }
.page > h2 + p.muted { font-size: 15px; max-width: 760px; margin-bottom: 26px; }
.page h3 { margin-top: 6px; }

/* ---------- Karten & Raster ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; position: relative; }
.card.click { cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s, background .15s; }
.card.click:hover { border-color: #39495f; transform: translateY(-2px); box-shadow: var(--shadow); background: var(--surface2); }
.card h3 { display: flex; align-items: center; gap: 8px; }
.card .best { margin-top: 12px; font-size: 12.5px; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.card.hero { padding: 28px; background: radial-gradient(120% 140% at 0% 0%, rgba(62, 227, 174, .14), transparent 55%), var(--surface); border-color: #27403a; }
.card.accent { border-color: #2a5a4b; background: linear-gradient(180deg, rgba(62, 227, 174, .07), transparent 70%), var(--surface); }
.card.warn { border-color: #5a4626; background: linear-gradient(180deg, rgba(255, 181, 71, .07), transparent 70%), var(--surface); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650; padding: 3px 9px; border-radius: 99px;
  background: var(--surface3); color: var(--text2); }
.badge.ok { background: var(--accent-soft); color: var(--accent); } .badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin: 16px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.stat b { display: block; font-size: 22px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; font-weight: 500; }
.advice { border: 1px solid #22463b; border-left: 3px solid var(--accent); background: rgba(62, 227, 174, .05); padding: 13px 16px; border-radius: var(--r-sm); margin: 12px 0; color: var(--text2); }
.advice.warn { border-color: #4b3b22; border-left-color: var(--warn); background: rgba(255, 181, 71, .05); }
.advice.info { border-color: var(--line2); border-left-color: var(--info); background: rgba(110, 168, 255, .04); }
.advice b { color: var(--text); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
tr:hover > td { background: rgba(255, 255, 255, .015); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.big { font-size: 38px; font-weight: 800; color: var(--accent); letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0; }
.vs .card { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.vs .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.progress { height: 6px; background: var(--surface3); border-radius: 6px; overflow: hidden; margin: 10px 0 18px; }
.progress div { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 6px; transition: width .3s; }
details summary { list-style: none; } details summary::-webkit-details-marker { display: none; }
tr.expand { cursor: pointer; }
tr.expand:hover td, tr.expand.open td { background: var(--surface2); }
tr.expand .arrow { color: var(--accent); display: inline-block; width: 14px; }
tr.detail > td { background: var(--bg2); padding: 6px 20px 20px; }
.detailbox h3 { margin-top: 14px; }

/* ---------- Assistent ---------- */
.steps { display: flex; gap: 6px; margin: 0 0 26px; flex-wrap: wrap; }
.steps .st { display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 8px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--muted); font-weight: 550; }
.steps .st i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface3); font-size: 12px; color: var(--text2); }
.steps .st.on { color: var(--text); border-color: #2a5a4b; background: var(--accent-soft); }
.steps .st.on i { background: var(--accent); color: var(--accent-ink); }
.steps .st.done i { background: #1e3c33; color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface); cursor: pointer; font-weight: 550; color: var(--text2); margin: 0 8px 8px 0; user-select: none; transition: all .15s; }
.chip:hover { border-color: #3a485d; }
.chip.on { border-color: var(--accent2); background: var(--accent-soft); color: var(--text); }
.chip input { display: none; }
.gamecard .val { font-size: 34px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

/* ---------- Spiel: Start-Fenster, Countdown, HUD ---------- */
#overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  background: rgba(6, 8, 12, .62); backdrop-filter: blur(6px); text-align: center; }
#overlay .box { background: rgba(19, 25, 34, .96); border: 1px solid var(--line2); border-radius: 18px; padding: 30px 38px; max-width: 480px; box-shadow: var(--shadow); animation: pop .16s ease-out; }
#overlay .box h2 { font-size: 24px; }
#overlay .kbd { display: inline-block; padding: 1px 7px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 6px; font-size: 12px; color: var(--text2); background: var(--surface2); }
@keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
#countdown { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-shadow: 0 4px 24px #000; }
#countdown .cd-title { font-size: 18px; font-weight: 650; color: var(--text2); letter-spacing: .02em; margin-bottom: 6px; }
#countdown .cd-num { font-size: 110px; font-weight: 800; line-height: 1; animation: cd .7s ease-out; }
@keyframes cd { from { transform: scale(1.35); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); } }
#hud { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px;
  background: rgba(10, 13, 18, .62); border: 1px solid rgba(255, 255, 255, .06); border-radius: 14px; backdrop-filter: blur(8px);
  font-variant-numeric: tabular-nums; pointer-events: none; overflow: hidden; }
#hud > div { text-align: center; padding: 4px 16px; min-width: 92px; }
#hud b { display: block; font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
#hud span { font-size: 10.5px; font-weight: 650; color: var(--muted); letter-spacing: .1em; }
#hud .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); transition: width .1s linear; min-width: 0; padding: 0; }
#hudTitle { position: fixed; top: 86px; left: 50%; transform: translateX(-50%); font-size: 12.5px; color: rgba(232, 237, 244, .55); pointer-events: none; font-weight: 550; }
#crosshair { position: fixed; left: 50%; top: 50%; pointer-events: none; transform: translate(-50%, -50%); }
#hitmarker { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; }
#hitmarker.show { animation: hit .16s ease-out; }
@keyframes hit { from { opacity: 1; transform: translate(-50%, -50%) scale(.8); } to { opacity: 0; transform: translate(-50%, -50%) scale(1.25); } }

/* ---------- Dialoge & Hinweise ---------- */
.dialog-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(5, 7, 10, .6); backdrop-filter: blur(4px); display: grid; place-items: center; animation: fade .14s; }
.dialog-wrap.out { opacity: 0; transition: opacity .14s; }
.dialog { width: min(440px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line2); border-radius: 18px; padding: 24px; box-shadow: var(--shadow); animation: pop .16s ease-out; }
.dialog-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: rgba(110, 168, 255, .12); color: var(--info); margin-bottom: 14px; }
.dialog-icon.danger { background: var(--bad-soft); color: var(--bad); }
@keyframes fade { from { opacity: 0; } }
#toasts { position: fixed; right: 20px; bottom: 20px; z-index: 70; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line2); box-shadow: var(--shadow); color: var(--text); animation: tin .2s ease-out; max-width: 380px; }
.toast.ok .ico { color: var(--accent); } .toast.warn .ico { color: var(--warn); } .toast.info .ico { color: var(--info); }
.toast.out { opacity: 0; transform: translateY(6px); transition: all .25s; }
@keyframes tin { from { opacity: 0; transform: translateY(10px); } }

@media (max-width: 760px) {
  .skillrow { grid-template-columns: 1fr !important; } .shotgrid { grid-template-columns: 1fr !important; }
  nav { width: 66px; } nav .logo span.t, nav .section, nav .sensbox, nav button span { display: none; } main { padding: 22px 16px; }
}
</style>
</head>
<body>
<header id="titlebar"><svg width="18" height="18" viewBox="0 0 256 256"><use href="#logo"/></svg><b>AimForge</b><span id="tbVersion"></span></header>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6af5c9"/><stop offset="1" stop-color="#18b386"/></linearGradient>
  <symbol id="logo" viewBox="0 0 256 256"><rect x="8" y="8" width="240" height="240" rx="58" fill="#141b25"/>
    <circle cx="128" cy="128" r="60" fill="none" stroke="url(#lg)" stroke-width="18"/>
    <path d="M128 40v36M128 180v36M40 128h36M180 128h36" stroke="url(#lg)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="128" cy="128" r="16" fill="#ff4d63"/></symbol></defs></svg>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div><b id="hudTime">0</b><span>ZEIT</span></div>
  <div><b id="hudScore">0</b><span>PUNKTE</span></div>
  <div><b id="hudAcc">0</b><span>GENAUIGKEIT</span></div>
  <div class="bar" id="hudBar"></div>
</div>
<div id="hudTitle" class="hidden"></div>
<svg id="crosshair" class="hidden"></svg>
<svg id="hitmarker" viewBox="0 0 26 26"><path d="M3 3l6 6M23 3l-6 6M3 23l6-6M23 23l-6-6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
<div id="countdown" class="hidden"></div>
<div id="overlay" class="hidden"><div class="box" id="overlayBox"></div></div>

<div id="menu">
  <nav>
    <div class="logo"><svg width="30" height="30" viewBox="0 0 256 256"><use href="#logo"/></svg><span class="t">Aim<span>Forge</span></span></div>
    <button data-page="home"><!--i:house--><span>Start</span></button>
    <button data-page="wizard"><!--i:wand-sparkles--><span>Sens-Assistent</span></button>
    <button data-page="sens"><!--i:gamepad-2--><span>Meine Spiele</span></button>
    <div class="section">Trainieren</div>
    <button data-page="train"><!--i:crosshair--><span>Training</span></button>
    <button data-page="profile"><!--i:radar--><span>Fähigkeitsprofil</span></button>
    <button data-page="stats"><!--i:chart-line--><span>Statistik</span></button>
    <div class="section">App</div>
    <button data-page="settings"><!--i:settings--><span>Einstellungen</span></button>
    <div class="sensbox" id="sensbox" title="Werte für deine Spiele anzeigen"></div>
  </nav>
  <main><div class="page" id="page"></div></main>
</div>
<script>/*BUNDLE*/</script>
</body>
</html>
