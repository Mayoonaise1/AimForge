# Baut die Windows-App (Installer + portable .exe) auf einem Windows-Server von GitHub.
# Start: automatisch bei einem Versions-Tag (z. B. v2.0.0) oder manuell unter „Actions“.
name: Windows-App bauen

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Installer und portable Version bauen
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: AimForge-Windows
          path: release/*.exe
          if-no-files-found: error
      - name: Als Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe \
            --title "AimForge ${GITHUB_REF_NAME#v}" \
            --notes "Windows-Version von AimForge.

          **Installer:** \`AimForge-Setup-${GITHUB_REF_NAME#v}.exe\` – installiert AimForge mit Startmenü- und Desktop-Verknüpfung.
          **Portable:** \`AimForge-${GITHUB_REF_NAME#v}-portable.exe\` – ohne Installation, einfach starten.

          Windows zeigt beim ersten Start eventuell „Der Computer wurde durch Windows geschützt“, weil die App nicht kostenpflichtig signiert ist: *Weitere Informationen → Trotzdem ausführen*."
