# Baut die Windows-App (Installer + portable .exe) auf einem Windows-Server von GitHub
# und veröffentlicht sie als Release. Die Version kommt aus package.json ("version"):
# neue Version eintragen + auf main pushen -> neues Release v<version>.
# Gleiche Version erneut gepusht -> die Dateien des bestehenden Releases werden ersetzt.
name: Windows-App bauen

on:
  push:
    branches: [main]
    paths: ['src/**', 'electron/**', 'build/**', 'package.json', 'package-lock.json', 'build.mjs', '.github/workflows/windows-release.yml']
  workflow_dispatch:

concurrency:
  group: windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Installer und portable Version bauen
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: AimForge-Windows
          path: release/*.exe
          if-no-files-found: error
      - name: Als Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe --clobber
          else
            gh release create "$TAG" release/*.exe --target "$GITHUB_SHA" --title "AimForge $V" \
              --notes "Windows-Version von AimForge.

          **Installer:** \`AimForge-Setup-$V.exe\` – installiert AimForge mit Startmenü- und Desktop-Verknüpfung.
          **Portable:** \`AimForge-$V-portable.exe\` – ohne Installation, einfach starten.

          Windows zeigt beim ersten Start eventuell „Der Computer wurde durch Windows geschützt“, weil die App nicht kostenpflichtig signiert ist: *Weitere Informationen → Trotzdem ausführen*."
          fi
