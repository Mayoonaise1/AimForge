<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AimForge</title>
<style>
:root {
  --bg: #12151b; --panel: #1b2029; --panel2: #232a35; --line: #313a48;
  --text: #e8ecf2; --muted: #95a0b2; --accent: #4fd1a5; --accent2: #3aa886;
  --warn: #ffb648; --bad: #ff5d6c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
.hidden { display: none !important; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2);
  color: var(--text); padding: 9px 16px; border-radius: 8px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #0b1a14; border-color: var(--accent); font-weight: 600; }
button.primary:hover { background: #6fe0b9; }
input, select { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 9px; width: 100%; }
label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
h1, h2, h3 { margin: 0 0 12px; font-weight: 650; }
h2 { font-size: 22px; } h3 { font-size: 16px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
small { color: var(--muted); }

#menu { position: fixed; inset: 0; display: flex; background: rgba(18,21,27,.96); }
nav { width: 220px; background: var(--panel); border-right: 1px solid var(--line); padding: 22px 14px;
  display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
nav .logo { font-weight: 800; font-size: 20px; margin: 0 8px 20px; letter-spacing: .5px; }
nav .logo span { color: var(--accent); }
nav button { text-align: left; border: none; background: none; padding: 10px 12px; color: var(--muted); }
nav button.active, nav button:hover { background: var(--panel2); color: var(--text); }
nav .sensbox { margin-top: auto; padding: 12px; background: var(--panel2); border-radius: 8px; font-size: 13px; }
main { flex: 1; overflow-y: auto; padding: 32px 40px; }
.page { max-width: 1000px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.card.click { cursor: pointer; transition: border-color .15s, transform .15s; }
.card.click:hover { border-color: var(--accent); transform: translateY(-2px); }
.card .best { margin-top: 10px; font-size: 13px; color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
.stat { background: var(--panel2); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font-size: 22px; }
.stat span { color: var(--muted); font-size: 12px; }
.advice { border-left: 4px solid var(--accent); background: var(--panel2); padding: 12px 16px; border-radius: 6px; margin: 12px 0; }
.advice.warn { border-color: var(--warn); }
.advice.info { border-color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.big { font-size: 34px; font-weight: 750; color: var(--accent); }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0; }
.vs .card { cursor: pointer; }
.vs .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.progress { height: 6px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin: 10px 0 18px; }
.progress div { height: 100%; background: var(--accent); }

#overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(10,12,16,.55); text-align: center; }
#overlay .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 36px; max-width: 460px; }
#countdown { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 96px; font-weight: 800; pointer-events: none; text-shadow: 0 4px 20px #000; }
#hud { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 26px;
  background: rgba(15,18,24,.7); padding: 8px 22px; border-radius: 10px; font-variant-numeric: tabular-nums;
  pointer-events: none; }
#hud div { text-align: center; } #hud b { display: block; font-size: 20px; } #hud span { font-size: 11px; color: var(--muted); }
#crosshair { position: fixed; left: 50%; top: 50%; pointer-events: none; transform: translate(-50%, -50%); }
@media (max-width: 700px) { nav { width: 64px; } nav .logo, nav .sensbox, nav button span { display: none; } main { padding: 20px 16px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div><b id="hudTime">0</b><span>ZEIT</span></div>
  <div><b id="hudScore">0</b><span>PUNKTE</span></div>
  <div><b id="hudAcc">0</b><span>GENAUIGKEIT</span></div>
</div>
<svg id="crosshair" class="hidden"></svg>
<div id="countdown" class="hidden"></div>
<div id="overlay" class="hidden"><div class="box" id="overlayBox"></div></div>

<div id="menu">
  <nav>
    <div class="logo">Aim<span>Forge</span></div>
    <button data-page="train" class="active">🎯 <span>Training</span></button>
    <button data-page="sens">🎮 <span>Sensitivität</span></button>
    <button data-page="finder">🧭 <span>Sens-Finder</span></button>
    <button data-page="stats">📈 <span>Statistik</span></button>
    <button data-page="settings">⚙️ <span>Einstellungen</span></button>
    <div class="sensbox" id="sensbox"></div>
  </nav>
  <main><div class="page" id="page"></div></main>
</div>
